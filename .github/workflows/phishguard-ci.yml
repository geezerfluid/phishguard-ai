name: PhishGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Validate Flask application
      run: |
        cd backend
        python -c "import sys; sys.path.append('.'); import app; print('Flask application imported successfully')"

    - name: Build Docker image
      run: |
        docker build -t phishguard-ai:latest -f Dockerfile .
